[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["wallet_manager*"]

[project]
name = "wallet-manager"
version = "2.0.0"
description = "Automated DeFi portfolio management on Base"
requires-python = ">=3.11"
readme = "wallet_manager/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "aioresponses>=0.7.6",
    "mypy>=1.9",
    "ruff>=0.4",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["E501", "SIM108", "B007", "UP007", "B904", "A002", "A003", "N803", "N806", "N812", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "S101"]
"scripts/*" = ["T201", "S101"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = [
    "tests/",
    "scripts/",
]

[[tool.mypy.overrides]]
module = "wallet_manager.strategies.oci_deployer"
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["wallet_manager"]
omit = [
    "tests/*",
    "scripts/*",
    "wallet_manager/__pycache__/*",
    "wallet_manager/ml_models/*",
    "wallet_manager/strategies/oci_deployer.py",
    "wallet_manager/allcode.txt",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
