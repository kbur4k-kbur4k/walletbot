version: "3.9"

services:
  wallet_manager:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./wallets.json:/app/wallets.json:ro
      - ./ml_models:/app/ml_models:ro
      - ./logs:/app/logs
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
