apiVersion: apps/v1
kind: Deployment
metadata:
  name: walletbot
  labels:
    app: walletbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: walletbot
  template:
    metadata:
      labels:
        app: walletbot
    spec:
      containers:
        - name: walletbot
          image: walletbot:latest
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: walletbot-config
            - secretRef:
                name: walletbot-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
