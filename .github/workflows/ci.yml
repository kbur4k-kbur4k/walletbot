name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet_manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: wallet_manager/requirements.txt

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format . --check

  # ── Type check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet_manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: wallet_manager/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: mypy
        run: mypy wallet_manager/ --ignore-missing-imports

  # ── Security ──────────────────────────────────────────────────────────────
  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet_manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: wallet_manager/requirements.txt

      - name: Install security tools
        run: pip install "bandit[toml]>=1.7" "pip-audit>=2.7"

      - name: bandit
        run: bandit -r wallet_manager/ -c pyproject.toml -ll

      - name: pip-audit
        run: pip-audit -r requirements.txt

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: wallet_manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: wallet_manager/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=wallet_manager \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            -x \
            --timeout=120
        env:
          VAULT_KEY: "kVdPFDoKAHLY4q8X_UrFNVYp5OjLw7fIqO8YtK-3rWo="
          EXECUTION_MODE: "legacy"
          TELEGRAM_BOT_TOKEN: "test_token"
          TELEGRAM_CHAT_ID: "123456789"
          RPC_URL_PRIMARY: "https://mock-rpc.invalid"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: wallet_manager/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ── Docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet_manager
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: wallet_manager
          push: false
          tags: wallet-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
